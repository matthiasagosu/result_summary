<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <section class="main-section">
      <div class="result-header">Your Result</div>
      <div class="actual-result">76</div>
      <div class="possible-result">of 100</div>
      <p class="result-comment">Great</p>
      <p class="result-additional-info">
        You scored higher than 65% of the people who have taken these tests.
      </p>
    </section>
    <section class="summary-section">
      <div class="summary-header">Summary</div>
      <img src="assets/images/icon-reaction.svg" alt="" />
      <div class="summary-reaction">Reaction 80 / 100</div>
      <img src="assets/images/icon-memory.svg" alt="" />
      <div class="summary-memory">Memory 92 / 100</div>
      <img src="assets/images/icon-verbal.svg" alt="" />
      <div class="summary-verbal">Verbal 61 / 100</div>
      <img src="assets/images/icon-visual.svg" alt="" />
      <div class="summary-visual">Visual 72 / 100</div>
      <button class="continue-button">Continue</button>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Matt Hias</a>.
    </footer>
  </body>
</html>
