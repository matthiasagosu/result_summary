<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <main>
      <section class="main-section">
        <div class="result-header">Your Result</div>
        <div class="result-circle">
          <div class="actual-result">76</div>
          <div class="possible-result">of 100</div>
        </div>
        <p class="result-comment">Great</p>
        <p class="result-additional-info">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>
      <section class="summary-section">
        <div class="summary-header">Summary</div>
        <div class="reaction-container">
          <img src="assets/images/icon-reaction.svg" alt="" />
          <span class="summary-reaction">Reaction</span>
          <span class="reaction-result"><strong>80 </strong>/ 100</span>
        </div>
        <div class="memory-container">
          <img src="assets/images/icon-memory.svg" alt="" />
          <span class="summary-memory">Memory</span>
          <span class="memory-result"><strong>92</strong> / 100</span>
        </div>
        <div class="verbal-container">
          <img src="assets/images/icon-verbal.svg" alt="" />
          <span class="summary-verbal">Verbal</span>
          <span class="verbal-result"><strong>61</strong> / 100</span>
        </div>
        <div class="visual-container">
          <img src="assets/images/icon-visual.svg" alt="" />
          <span class="summary-visual">Visual</span>
          <span class="visual-result"><strong>72</strong> / 100</span>
        </div>
        <button class="continue-button">Continue</button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Matt Hias</a>.
    </footer>
  </body>
</html>
